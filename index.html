<script>
const pages=[...document.querySelectorAll('.page')], dots=[...document.querySelectorAll('.progress i')];
let idx=0, startY=0, startX=0;
function show(n){
  idx=(n+pages.length)%pages.length;
  pages.forEach((p,i)=>p.classList.toggle('active',i===idx));
  dots.forEach((d,i)=>d.classList.toggle('on',i===idx));
}
function tip(t){
  const h=document.getElementById('hint'); h.textContent=t; h.classList.add('show');
  clearTimeout(window.__tip); window.__tip=setTimeout(()=>h.classList.remove('show'),1800);
}
document.addEventListener('touchstart',e=>{startY=e.touches[0].clientY;startX=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{
  const dy=e.changedTouches[0].clientY-startY, dx=e.changedTouches[0].clientX-startX;
  if(Math.abs(dy)>55 && Math.abs(dy)>Math.abs(dx)){ show(idx+(dy<0?1:-1)); }
},{passive:true});
document.getElementById('share').onclick=()=>tip('请点击微信右上角“…” → 分享给朋友');
document.getElementById('copy').onclick=()=>tip('这是可编辑的 H5 模板，可替换文字与图片');
document.getElementById('music').onclick=()=>tip('如需背景音乐，可在代码中接入音频文件');
</script>
